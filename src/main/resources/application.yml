spring:
  application:
    name: coffee-order-system
  profiles:
    include: secret
  datasource:
    url: jdbc:mysql://localhost:3307/coffee_order_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    hikari:
      maximum-pool-size: 50
      connection-timeout: 30000
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      properties:
        spring.json.trusted.packages: "*"